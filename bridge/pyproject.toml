[project]
name = "a2a-document-bridge-core"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "google-adk[db]>=2.7.0,<3",
    "a2a-sdk[http-server,sql]",
    "pydantic>=2",
    "aiosqlite",
    "a2a-document-bridge-contract",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge"]

[tool.uv.sources]
a2a-document-bridge-contract = { path = "../contract", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "seam(name): the managed-service seam under test (sessions|task_store|exchange_store|skill_registry|scheduler|extraction)",
]

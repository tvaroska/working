[project]
name = "a2a-document-bridge-agents"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.7.0,<3",
    "a2a-sdk[http-server]",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents", "src/bridge_client", "src/contract"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

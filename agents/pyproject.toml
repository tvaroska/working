[project]
name = "a2a-document-bridge-agents"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "google-adk[db]>=2.7.0,<3",
    "a2a-sdk[http-server,sql]",
    "pydantic>=2",
    "aiosqlite",
    "a2a-document-bridge-contract",
    # Frontend-v1 demo BFF servers (console/ops/portal/timewarp) run under uvicorn.
    # Starlette itself arrives transitively via a2a-sdk[http-server]; the BFF servers
    # use raw Starlette StreamingResponse for SSE (no sse-starlette dependency).
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # M1.13 test-only: drive the durable graph against the *real* Bridge edge for
    # mock→real terminal-outcome parity. The production agent (agent.py/graph.py) must
    # NOT import bridge; only the parity test server (tests/support/live_bridge_server.py)
    # and the demo BFF servers (agents/address/*_server.py — Frontend-v1) do. The BFF
    # servers are demo furniture (lessons A9), imported only in local dev / tests.
    "a2a-document-bridge-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents", "src/bridge_client"]

[tool.uv.sources]
a2a-document-bridge-contract = { path = "../contract", editable = true }
a2a-document-bridge-core = { path = "../bridge", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
